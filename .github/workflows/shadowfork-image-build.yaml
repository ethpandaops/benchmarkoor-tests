name: shadowfork-image-build

# Builds the geth half of a post-Gloas benchmark image: a fresh mainnet snapshot advanced by one
# pre-run (EIP-8282 contracts, Amsterdam, 24 KiB + 64 KiB receivers), its gas limit walked down,
# the fill flushed out of geth's journal and compacted. Uploads the geth image and the replay
# bundle; the other clients replay the bundle afterwards (shadowfork/README.md). `latest` is
# written only once every client is up.
run-name: "shadowfork-image-build · anchor=${{ inputs.anchor }} · receivers=${{ inputs.receivers }} · gas=${{ inputs.gas-target }}"

on:
  workflow_dispatch:
    inputs:
      anchor:
        description: "Mainnet block of the snapshots.ethpandaops.io geth snapshot to start from (or latest)"
        default: "latest"
      receivers:
        description: "Receivers per variant, at each code size (100000 covers benchmarks up to ~300 Mgas, 321000 needs 1 Ggas)"
        default: "100000"
      gas-target:
        description: "Gas limit of the published head"
        default: "200000000"
      eest-repo:
        description: "execution-specs repo for the fill"
        default: "https://github.com/qu0b/execution-specs.git"
      eest-ref:
        description: "execution-specs ref: upstream forks/amsterdam + #3648 (fixture spill) + #3304 (deploy script) + the combined-sizes test"
        default: "qu0b/bench-images-v3"
      geth-image:
        description: "geth release that fills and opens the image (the one the devnets run)"
        default: "ethereum/client-go:v1.17.7"
      benchmarkoor-image:
        description: "benchmarkoor image"
        default: "ghcr.io/ethpandaops/benchmarkoor:master"
      runner:
        description: "Runner (JSON). Needs ~2 TB free for a mainnet geth datadir plus the fill"
        default: '{"group": "synctest", "labels": "Disk4TB"}'
      publish:
        description: "Upload the image and bundle (false: build and verify locally only)"
        type: boolean
        default: true

concurrency:
  group: shadowfork-image-build
  cancel-in-progress: false

jobs:
  geth:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 2880
    env:
      GETH_IMAGE: ${{ inputs.geth-image }}
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Environment
        run: |
          echo "SF_WORK=${{ runner.temp }}/shadowfork" >> "$GITHUB_ENV"
          for t in docker jq zstd curl python3; do command -v $t >/dev/null || { echo "::error::$t missing"; exit 1; }; done
          command -v rclone >/dev/null || curl -fsSL https://rclone.org/install.sh | sudo bash
          df -h "${{ runner.temp }}"

      - name: Bucket access
        if: inputs.publish
        run: |
          source shadowfork/lib.sh
          p="build-test/probe-${{ github.run_id }}"
          if ! { echo probe | r2 rcat "r2:$BUCKET/$p" && r2 deletefile "r2:$BUCKET/$p"; }; then
            echo "::error::the repo's S3 credentials cannot write $BUCKET"; exit 1
          fi

      - name: Snapshot and genesis
        run: shadowfork/prepare.sh "${{ inputs.anchor }}"

      - name: Pre-run config
        id: cfg
        env:
          RECEIVERS: ${{ inputs.receivers }}
          EEST_REPO: ${{ inputs.eest-repo }}
          EEST_REF: ${{ inputs.eest-ref }}
        run: |
          source shadowfork/lib.sh; source "$SF_WORK/anchor.env"
          # The pre-run advances the datadir in place: schelk's CLI over a bind mount, no baseline.
          { echo "SCHELK_DIR=$DATADIR"; echo "SCHELK_STATE=$SF_WORK/.schelk/state.json"
            echo "BENCHMARKOOR_SCHELK_BIN=$PWD/shadowfork/inplace-schelk"; echo "TMPDIR=$SF_WORK/tmp"; } >> "$GITHUB_ENV"
          mkdir -p "$SF_WORK/tmp"
          SCHELK_DIR=$DATADIR SCHELK_STATE=$SF_WORK/.schelk/state.json shadowfork/inplace-schelk mount
          { echo 'config<<EOF'; shadowfork/prerun-config.sh; echo EOF; } >> "$GITHUB_OUTPUT"

      - name: Pre-run (fill)
        uses: ethpandaops/benchmarkoor@master
        env:
          BENCHMARKOOR_BUILDER_RUN_TIMEOUT: 2400m
        with:
          mode: build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ inputs.benchmarkoor-image }}
          upload-artifacts: "false"
          upload-build-artifacts: "false"
          tmp-dir: ${{ env.SF_WORK }}/tmp
          build-config: ${{ steps.cfg.outputs.config }}
          build-args: --force

      - name: Ramp-down, journal flush, compaction, digest
        env:
          GAS_TARGET: ${{ inputs.gas-target }}
        run: |
          source shadowfork/lib.sh; source "$SF_WORK/anchor.env"
          sudo touch "$DATADIR/.advanced"
          sudo umount "$DATADIR"
          shadowfork/finalize.sh

      - name: Publish
        if: inputs.publish
        run: shadowfork/publish.sh

      - name: Verify uploads
        if: inputs.publish
        run: |
          source shadowfork/lib.sh
          END=$(jq .end_block_number "$SF_WORK/bundle/pre_run_bundle/pre-run.meta.json")
          shadowfork/verify.sh "mainnet/geth/$END/snapshot.tar.zst" "$SF_WORK/publish-geth.blocks" 3
          shadowfork/verify.sh "bundles/mainnet-$END/bundle.tar.zst" "$SF_WORK/publish-bundle.blocks" 1

      - name: Summary
        if: always()
        run: |
          m=$SF_WORK/bundle/pre_run_bundle/pre-run.meta.json
          [ -f "$m" ] || exit 0
          {
            echo "### shadowfork image (geth)"
            echo '```json'; cat "$m"; echo '```'
            [ -f "$SF_WORK/publish-geth.blocks" ] && echo "geth image: $(awk '$2=="total"{print $1}' "$SF_WORK/publish-geth.blocks") bytes"
            echo
            echo "Next: replay the bundle on the other clients, then metadata and \`latest\` (shadowfork/README.md)."
          } >> "$GITHUB_STEP_SUMMARY"

      # The runner is shared (syncoor): never leave 1.5 TB behind.
      - name: Clean up
        if: always()
        run: |
          docker rm -f sf-geth >/dev/null 2>&1 || true
          [ -z "${SF_WORK:-}" ] || { sudo umount "$SF_WORK/geth-datadir" 2>/dev/null || true; sudo rm -rf "$SF_WORK"; }
