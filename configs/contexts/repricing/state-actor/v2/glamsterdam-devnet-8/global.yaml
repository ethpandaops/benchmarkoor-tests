global:
  env:
    EEST_FIXTURES_DIR: /tmp/benchmarkoor/eest-fixtures/state-actor-glamsterdam-devnet-8

    # Same EEST source as jochemnet/v1/glamsterdam-devnet-8, so both
    # snapshots fill the same benchmarks.
    EEST_REPO: https://github.com/skylenet/execution-specs.git
    EEST_REF: fix/no-reset-reanchor-start-block

    # The state-actor genesis has timestamp 0, so amsterdam activates at 1:
    # every block after genesis is an amsterdam block. The builder and the
    # runner both read this file, so the filled payloads and the run agree on
    # the schedule.
    AMSTERDAM_ACTIVATION_TS: "1"
