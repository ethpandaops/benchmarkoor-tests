runner:
  # One bal-full instance per client. The sequential/nobatchio A/B variants are
  # retired — full BAL mode is the mode under analysis.
  #
  # Images track the client TRUNK branches, matching the EL set in
  # glamsterdam-devnets ansible/inventories/devnet-9/group_vars/all/images.yaml.
  # reth and nimbus-eth1 have not moved there yet and stay on the devnet-8 tag.
  #
  # Pinned per-commit, never the rolling main/master tag. The rolling tag is
  # rebuilt daily, so it would silently change what a result measures with
  # nothing in this file to attribute the change to.
  #
  # Safe to run the devnet-8 payload release against these: repricing was frozen
  # at ACDT #90, and besu's AmsterdamGasCalculator constants are identical on
  # main and on the devnet-8 head eea3174.
  instances:
    # Geth
    - id: geth-bal-full
      client: geth
      metadata:
        labels:
          bal-mode: full
      image: ethpandaops/geth:master-bbb9119
      extra_args:
        - --engine.maxreorgdepth=1024
        - --override.amsterdam=${AMSTERDAM_ACTIVATION_TS}
        - --debug.logslowblock=0
      db_compaction:
        enabled: true
        when: [before_benchmarks]
        inspect: true
        timeout: 60m
        persist:
          enabled: true

    # Besu
    - id: besu-bal-full
      client: besu
      metadata:
        labels:
          bal-mode: full
      image: ethpandaops/besu:main-7f19839
      genesis_fork_override:
        amsterdam: ${AMSTERDAM_ACTIVATION_TS}
      environment:
        BESU_OPTS: "-Xms8g -Xmx8g -XX:+AlwaysPreTouch"
      extra_args:
        - --Xplugin-rocksdb-high-spec-enabled=true
        # Bal mode flags
        - --Xbal-perfect-parallelization-enabled=true
        - --Xbal-state-root-enabled=true

    # The besu-bal-full-aot twin is parked. It needs an image with a
    # Project Leyden AOT cache baked in, and the newest cache the Besu team has
    # published is aot-glam-devnet7-00d2f04 — devnet-7, not trunk. Generating one
    # needs a >2h real run against the devnet, so it lags the image.
    # To bring it back: get a cache for the pinned besu commit above, run
    # ~/repos/ethpandaops/bin/besu-aot-bake.sh, then re-add the instance with
    # image: ethpandaops/besu:main-aot-<commit> and BESU_OPTS carrying
    # -XX:AOTCache=/opt/besu/aot/besu.aot -XX:AOTMode=on. Bump it and
    # besu-bal-full together — a cache is only valid for the exact jars it was
    # generated against.

    # Reth — still on the devnet-8 tag. Its repricing constants come from the
    # pinned revm, not from the reth tree, so trunk readiness is a question
    # about that pin. Check before moving it.
    - id: reth-bal-full
      client: reth
      metadata:
        labels:
          bal-mode: full
      image: ethpandaops/reth:glamsterdam-devnet-8
      genesis_fork_override:
        amsterdam: ${AMSTERDAM_ACTIVATION_TS}
      extra_args:
        - --engine.slow-block-threshold=0
      retry_new_payloads_failed_state:
        enabled: true
        max_retries: 10
        backoff: 1s

    # Nethermind
    - id: nethermind-bal-full
      client: nethermind
      metadata:
        labels:
          bal-mode: full
      image: ethpandaops/nethermind:master-f0a29b8
      genesis_eip_override:
        timestamp: ${AMSTERDAM_ACTIVATION_TS}
        eips: [2780, 7708, 7778, 7843, 7928, 7954, 7976, 7981, 7997, 8024, 8037, 8038, 8246, 8282]
      extra_args:
        - --Init.BaseDbPath=/data
        - --FlatDb.Enabled=true
        - --FlatDb.CompactionOffset=0
        - --FlatDb.MinReorgDepth=1024
        - --FlatDb.MaxReorgDepth=1024
        - --Blocks.ParallelExecution=true # Default is true, but set explicitly for clarity
        - --Blocks.ParallelExecutionBatchRead=true # Default is true, but set explicitly for clarity

    # Erigon
    ## Help for erigon flags:
      # --exec.batched-io  | true      | Turn on/off batched ahead of time db reads
      # --exec.state-cache | true      | Turn on/off local caching of db reads
      # --exec.workers     | num cpu/2 | Number of workers used for exec
      # --exec.serial      | false     | Force workers to be 1
      # --exec.no-merge.   | false.    | Turn off background merging
      # --exec.no-prune.   | false.    | Turn off db removal
    ##
    - id: erigon-bal-full
      client: erigon
      metadata:
        labels:
          bal-mode: full
      image: ethpandaops/erigon:main-b8119d4
      extra_args:
        - --override.amsterdam=${AMSTERDAM_ACTIVATION_TS}
        - --exec.no-merge=true
        - --exec.no-prune=true
        - --exec.no-background-maintenance
        - --experimental.parallel-commitment
      bootstrap_fcu:
        enabled: true
        max_retries: 120
        backoff: 30s
      # erigon answers newPayload with SYNCING while it is still processing, and
      # the pre-run replay treats a non-VALID status as a failure — it died on
      # the same payload (line 10003) on both attempts. Retry SYNCING rather
      # than the failed-state path; the two are separate settings and SYNCING
      # takes this one. Same generous budget as bootstrap_fcu above — erigon
      # can be slow to settle — but still bounded, so a stuck client fails
      # rather than stalling a ~15k-payload replay forever.
      retry_new_payloads_syncing_state:
        enabled: true
        max_retries: 240
        backoff: 30s

    # Ethrex
    - id: ethrex-bal-full
      client: ethrex
      metadata:
        labels:
          bal-mode: full
      image: ethpandaops/ethrex:main-91cfe52
      genesis_fork_override:
        amsterdam: ${AMSTERDAM_ACTIVATION_TS}
      extra_args:
        - --skip-genesis-validation
        - --no-precompile-cache

    # Nimbus — still on the devnet-8 tag, not yet moved to trunk upstream.
    - id: nimbus-bal-full
      client: nimbus
      metadata:
        labels:
          bal-mode: full
      image: ethpandaops/nimbus-eth1:glamsterdam-devnet-8
      genesis_fork_override:
        amsterdam: ${AMSTERDAM_ACTIVATION_TS}
