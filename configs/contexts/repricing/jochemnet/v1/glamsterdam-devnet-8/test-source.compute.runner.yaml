global:
  env:
    # Consumed by the geth-bal-full instance in clients.yaml. Compute runs use
    # no rollback (see runner.client.config below), but geth OOMs without one,
    # so it rolls back with debug_setHead. The stateful runner file does not
    # set this, so stateful geth keeps container-recreate.
    GETH_ROLLBACK_STRATEGY: rpc-debug-setHead
    # Same for the nethermind-bal-full instance: compute runs roll back with
    # debug_resetHead, stateful runs keep container-recreate.
    NETHERMIND_ROLLBACK_STRATEGY: rpc-debug-setHead

runner:
  benchmark:
    tests:
      metadata:
        labels:
          name: jochemnet-glamsterdam-devnet-8-compute-full
          block: "24402727"
          test-type: compute
          fork: amsterdam
          data-disk-type: schelk
      source:
        eest_fixtures:
          # A merged release: 2302 fixtures from build run 33759962853 (EEST
          # e269bb44) and 30 from build run 36119035780 (EEST 78680895), joined
          # by benchmarkoor-release's merge-from-release input. 2314 in total,
          # geth, 200-300 Mgas.
          #
          # Of the 30, 12 are new: the 4 random_* arms of
          # test_jumpdest_analysis and the 2 test_tstore_key_distribution arms,
          # each at both gas values. The other 18 replace the tiled
          # test_jumpdest_analysis cases. execution-specs#3631 rewrote that
          # test, so those 18 are different payloads, not re-fills. Do not
          # compare their numbers against the e269bb44 release.
          #
          # The older build's 28 failures are still absent: 10 "initcode prefix
          # too long" on the EIP-7928 block-access-list benchmarks (8
          # state_root_computation, 2 prefetch_cold_storage), 12 truncated-PUSH
          # variants EEST rejects as raw bytes, 2 cold SSTORE out-of-gas over
          # the gas cap and 4 full-data blocks short of sender balance.
          #
          # Neither build ran a pre_runs stage of its own. Both fillers booted
          # on the schelk backup, which the stateful build had already promoted
          # to block 24443820 (0xef8d2034), so every payload anchors on the
          # STATEFUL pre-run head, not on the raw 24402727 snapshot. The merge
          # carries that bundle over from the e269bb44 release, which took it
          # from
          # eest-payloads-jochemnet-v1-amsterdam-stateful-e269bb44-20260828-063412.
          # Keep the pre_runs block below: without the replay the runner starts
          # 41093 blocks short and every payload is an orphan.
          fixtures_url: https://github.com/ethpandaops/benchmarkoor-tests/releases/download/eest-payloads-jochemnet-v1-amsterdam-compute-78680895-20260925-093244/eest-payloads-jochemnet-v1-amsterdam-compute-geth.tar.gz
          fixtures_subdir: benchmarkoor-build-artifacts/eest-payloads/geth/blockchain_tests_stateful_engine
          pre_runs:
            fixtures_subdir: benchmarkoor-build-artifacts/pre-runs/geth/pre_run_bundle
  container_runtime: podman
  client:
    config:
      rollback_strategy: none
      post_test_sleep_duration: 200ms
