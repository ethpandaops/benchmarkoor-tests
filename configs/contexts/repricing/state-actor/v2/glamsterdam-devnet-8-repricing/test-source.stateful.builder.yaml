global:
  env:
    # Filler images
    NETHERMIND_IMAGE: ethpandaops/nethermind:glamsterdam-devnet-8
    GETH_IMAGE: ethpandaops/geth:glamsterdam-devnet-8

# No pre_runs stage. jochemnet/v1/glamsterdam-devnet-8 deploys the benchmark
# receivers and delegations in a pre-run; state-actor/v2 writes the same
# state into the datadir (configs/datadirs/state-actor/v2/builder.yaml).
builder:
  eest_payloads:
    pull_policy: always
    eest_repo: ${EEST_REPO}
    eest_ref: ${EEST_REF}
    config:
      fork: amsterdam
      # Key #0 → 0xf39Fd6…2266 (the pre-funded seed in the state-actor spec)
      rpc_seed_key: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      # Repricing subset: the repricing marker over the 100M-300M sweep
      # (same as jochemnet/v1/glamsterdam-devnet-8-repricing).
      gas_benchmark_values: [100,120,140,160,180,200,220,240,260,280,300]
      marker: repricing
      datadir_method: schelk
      tests:
        - tests/benchmark/stateful/bloatnet
      # test_deploy_existing_contracts is jochemnet's pre-run setup, not a
      # benchmark: it deploys the receivers and delegations that
      # state-actor/v2 already writes, so every CREATE2 deploy collides and
      # the receipts fail (4 failures in run 38439838358).
      filter: >-
        not test_deploy_existing_contracts
      extract_opcode_count: true
      # Resolves @pytest.mark.stub_parametrize prefixes against pre-deployed
      # state (e.g. bloated_eoa_10GB → 0x87a6…be04).
      address_stubs:
        bloated_eoa_10GB:
          addr: "0x87a6314da5ac8832f6e7a176c8fb133b19f5be04"
          pkey: "0x4da32d29f6dcffa26e09dc4e102033f2d105de1444fb893493ae703289275e0e"
    targets:
      - name: nethermind
        filler_client: nethermind
        filler_image: ${NETHERMIND_IMAGE}
        source_dir: ${STATE_DIR}/nethermind
        # nethermind reads a parity chainspec; amsterdam is activated via the
        # genesis_eip_override (same EIP set as the runner instance).
        genesis: ${STATE_DIR}/nethermind/parity-chainspec.json
        genesis_eip_override:
          timestamp: ${AMSTERDAM_ACTIVATION_TS}
          eips: [2780, 7708, 7778, 7843, 7928, 7954, 7976, 7981, 7997, 8024, 8037, 8038, 8246, 8282]
        output_dir: ${EEST_FIXTURES_DIR}/nethermind
        filler_extra_args:
          - --FlatDb.Enabled=true
          - --FlatDb.CompactionOffset=0
          - --FlatDb.MinReorgDepth=1024
          - --FlatDb.MaxReorgDepth=1024
          - --JsonRpc.MaxBatchSize=16384 # Default 1024
          - --Init.AutoDump=None
          - --Merge.NewPayloadBlockProcessingTimeout=70000
          - --Blocks.CachePrecompilesOnBlockProcessing=false

      - name: geth
        filler_client: geth
        # A failed or cancelled fill leaves fixtures with no build
        # fingerprint, and --rebuild-on-diff then skips the fill with a green
        # job (run 38435683141). force refills every time. The stateful and
        # compute builds also share this output_dir.
        force: true
        filler_image: ${GETH_IMAGE}
        source_dir: ${STATE_DIR}/geth
        output_dir: ${EEST_FIXTURES_DIR}/geth
        filler_extra_args:
          - --override.amsterdam=${AMSTERDAM_ACTIVATION_TS}
          - --engine.maxreorgdepth=1024 # Long-chain benchmarks exceed the 512 default
          - --rpc.batch-request-limit=16384 # Default 1000
          - --rpc.http-body-limit=128 # Default 5 (megabytes)
