runner:
  # One bal-full instance per client. The sequential/nobatchio A/B variants are
  # retired — full BAL mode is the mode under analysis. Besu keeps its AOT twin
  # for the JVM-warmup comparison.
  instances:
    # Geth
    - id: geth-bal-full
      client: geth
      metadata:
        labels:
          bal-mode: full
      image: ethpandaops/geth:master
      extra_args:
        - --engine.maxreorgdepth=1024
        - --override.amsterdam=${AMSTERDAM_ACTIVATION_TS}
        - --debug.logslowblock=0
      db_compaction:
        enabled: true
        when: [before_benchmarks]
        inspect: true
        timeout: 60m
        persist:
          enabled: true

    # Besu
    - id: besu-bal-full
      client: besu
      metadata:
        labels:
          bal-mode: full
      image: ethpandaops/besu:main
      genesis_fork_override:
        amsterdam: ${AMSTERDAM_ACTIVATION_TS}
      environment:
        BESU_OPTS: "-Xms8g -Xmx8g -XX:+AlwaysPreTouch"
      extra_args:
        - --Xplugin-rocksdb-high-spec-enabled=true
        # Bal mode flags
        - --Xbal-perfect-parallelization-enabled=true
        - --Xbal-state-root-enabled=true

    # Same as besu-bal-full, but on the AOT-cache image: the JVM starts
    # pre-warmed (Project Leyden) so Besu isn't penalised for JIT/C2 warmup.
    # PoC image, built manually by baking a Besu-team-provided AOT cache into
    - id: besu-bal-full-aot
      client: besu
      metadata:
        labels:
          bal-mode: full
          aot: "true"
      image: ethpandaops/besu:main-aot
      genesis_fork_override:
        amsterdam: ${AMSTERDAM_ACTIVATION_TS}
      environment:
        BESU_OPTS: "-Xms8g -Xmx8g -XX:+AlwaysPreTouch -XX:AOTCache=/opt/besu/aot/besu.aot -XX:AOTMode=on -Xlog:aot=info"
      extra_args:
        - --Xplugin-rocksdb-high-spec-enabled=true
        # Bal mode flags
        - --Xbal-perfect-parallelization-enabled=true
        - --Xbal-state-root-enabled=true

    # Reth
    - id: reth-bal-full
      client: reth
      metadata:
        labels:
          bal-mode: full
      image: ethpandaops/reth:glamsterdam-devnet-8
      genesis_fork_override:
        amsterdam: ${AMSTERDAM_ACTIVATION_TS}
      extra_args:
        - --engine.slow-block-threshold=0
      retry_new_payloads_failed_state:
        enabled: true
        max_retries: 10
        backoff: 1s

    # Nethermind
    - id: nethermind-bal-full
      client: nethermind
      metadata:
        labels:
          bal-mode: full
      image:  ethpandaops/nethermind:master
      genesis_eip_override:
        timestamp: ${AMSTERDAM_ACTIVATION_TS}
        eips: [2780, 7708, 7778, 7843, 7928, 7954, 7976, 7981, 7997, 8024, 8037, 8038, 8246, 8282]
      extra_args:
        - --Init.BaseDbPath=/data
        - --FlatDb.Enabled=true
        - --FlatDb.CompactionOffset=0
        - --FlatDb.MinReorgDepth=1024
        - --FlatDb.MaxReorgDepth=1024
        - --Blocks.ParallelExecution=true # Default is true, but set explicitly for clarity
        - --Blocks.ParallelExecutionBatchRead=true # Default is true, but set explicitly for clarity
      retry_new_payloads_syncing_state:
        enabled: true
        max_retries: 10
        backoff: 2s

    # Erigon
    ## Help for erigon flags:
      # --exec.batched-io  | true      | Turn on/off batched ahead of time db reads
      # --exec.state-cache | true      | Turn on/off local caching of db reads
      # --exec.workers     | num cpu/2 | Number of workers used for exec
      # --exec.serial      | false     | Force workers to be 1
      # --exec.no-merge.   | false.    | Turn off background merging
      # --exec.no-prune.   | false.    | Turn off db removal
    ##
    - id: erigon-bal-full
      client: erigon
      metadata:
        labels:
          bal-mode: full
      image: ethpandaops/erigon:main
      extra_args:
        - --override.amsterdam=${AMSTERDAM_ACTIVATION_TS}
        - --exec.no-merge=true
        - --exec.no-prune=true
        - --exec.no-background-maintenance
        - --experimental.parallel-commitment
      bootstrap_fcu:
        enabled: true
        max_retries: 120
        backoff: 30s
      # erigon answers newPayload with SYNCING while it is still processing, and
      # the pre-run replay treats a non-VALID status as a failure — it died on
      # the same payload (line 10003) on both attempts. Retry SYNCING rather
      # than the failed-state path; the two are separate settings and SYNCING
      # takes this one. Same generous budget as bootstrap_fcu above — erigon
      # can be slow to settle — but still bounded, so a stuck client fails
      # rather than stalling a ~15k-payload replay forever.
      retry_new_payloads_syncing_state:
        enabled: true
        max_retries: 240
        backoff: 30s

    # Ethrex
    - id: ethrex-bal-full
      client: ethrex
      metadata:
        labels:
          bal-mode: full
      image: ethpandaops/ethrex:main
      genesis_fork_override:
        amsterdam: ${AMSTERDAM_ACTIVATION_TS}
      extra_args:
        - --skip-genesis-validation
        - --no-precompile-cache

    # Nimbus
    - id: nimbus-bal-full
      client: nimbus
      metadata:
        labels:
          bal-mode: full
      image: ethpandaops/nimbus-eth1:glamsterdam-devnet-8
      genesis_fork_override:
        amsterdam: ${AMSTERDAM_ACTIVATION_TS}
