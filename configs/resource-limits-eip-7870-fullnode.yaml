runner:
  client:
    config:
      # Limits as per: https://eips.ethereum.org/EIPS/eip-7870
      resource_limits:
        cpuset_topology: full_cores # Mainly used to validate that the cpuset uses full cores
        cpuset: [5,13,6,14,7,15] # 6 Logical cores (threads), across 3 physical cores. (EIP says 8, but we should have CL buffer)
                                 # Use "cat /sys/devices/system/cpu/cpu*/topology/thread_siblings_list" to see the matching SMT pairs
        cpu_freq: "3600MHz"
        cpu_turboboost: false
        cpu_freq_governor: performance
        memory: "32g" # Note: the EIP mentions 32GB for EL + CL... so allocating 32GB for the EL is already a "bonus"
        swap_disabled: true
