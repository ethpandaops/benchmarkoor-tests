name: benchmarkoor-release

# Promotes eest payloads from an existing benchmarkoor-build run into a GitHub
# Release. It does NOT rebuild. Everything except the build run ID is derived:
#   - clients            → from the build run's per-client artifacts
#   - snapshot/context/
#     subdir/test-type   → parsed from the build run's run-name (displayTitle)
#   - fork/eest_sha and
#     the full per-client build details (state root, DB size, fixtures counts,
#     images, …) → from the state-actor-manifest.json + .benchmarkoor-fill.json
#     that ship inside each artifact (same data as benchmarkoor's build summary).
# Each client's artifact (benchmarkoor-build-<run_id>-<client>) is repackaged as
# a release asset, split into parts if it exceeds GitHub's 2 GB asset cap, and
# published with a manifest + checksums + download helper.

on:
  workflow_dispatch:
    inputs:
      build-run-id:
        description: "benchmarkoor-build run ID to promote payloads from"
        required: true
      tag:
        description: "Release tag (empty = auto: eest-payloads-<snapshot>-<fork>-<eest-sha8>)"
        required: false
        default: ""
      pre-runs-from-release:
        description: "Release tag to copy pre-runs/<client>/ from (empty = none)"
        required: false
        default: ""
      draft:
        description: "Keep the release as a draft for manual review"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

env:
  # GitHub caps each release asset at 2 GB; split anything larger into parts.
  MAX_ASSET_BYTES: "2000000000"
  SPLIT_SIZE: "1900M"

jobs:
  # Derive clients + context + lineage from the build run, then open a draft
  # release once so the parallel publish legs don't race to create it.
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      title: ${{ steps.meta.outputs.title }}
      fork: ${{ steps.meta.outputs.fork }}
      eest_sha: ${{ steps.meta.outputs.eest_sha }}
      asset_base: ${{ steps.meta.outputs.asset_base }}
      snapshot: ${{ steps.meta.outputs.snapshot }}
      context: ${{ steps.meta.outputs.context }}
      subdir: ${{ steps.meta.outputs.subdir }}
      test_type: ${{ steps.meta.outputs.test_type }}
      clients: ${{ steps.meta.outputs.clients }}
    steps:
      - name: Derive clients, context and lineage from the build run
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BUILD_RUN_ID: ${{ inputs.build-run-id }}
        run: |
          set -euo pipefail
          echo "Build run ID: $BUILD_RUN_ID"
          PREFIX="benchmarkoor-build-${BUILD_RUN_ID}-"

          # Context from the build run's run-name (see benchmarkoor-build.yaml).
          DT=$(gh run view "$BUILD_RUN_ID" -R "$REPO" --json displayTitle -q .displayTitle)
          field() { grep -oE "$1=[^ ]+" <<<"$DT" | head -1 | cut -d= -f2-; }
          SNAP=$(field snapshot); CTX=$(field context)
          SUBDIR=$(field subdir); TT=$(field test-type)
          if [ -z "$SNAP" ] || [ -z "$TT" ]; then
            echo "::error::Could not parse context from run $BUILD_RUN_ID (run-name: '$DT'). Was it built with a benchmarkoor-build that sets run-name?"
            exit 1
          fi

          # Clients from the per-client build artifacts.
          CLIENTS=$(gh api "/repos/$REPO/actions/runs/$BUILD_RUN_ID/artifacts" --paginate \
            --jq '.artifacts[].name' \
            | { grep -E "^${PREFIX}" || true; } | sed "s/^${PREFIX}//" | sort -u | jq -R . | jq -sc .)
          if [ "$CLIENTS" = "[]" ]; then
            echo "::error::No artifacts named ${PREFIX}<client> on run $BUILD_RUN_ID. Did the build run with upload-build-artifacts + per-client build-artifact-name?"
            exit 1
          fi

          # fork + eest_sha from the first client's sidecar. Prefer the build
          # sidecar (.benchmarkoor-build.json, written on successful build
          # completion); fall back to the fill sidecar (.benchmarkoor-fill.json,
          # written during the fill so it's present even when the build later
          # failed on some tests and .benchmarkoor-build.json is absent).
          FIRST=$(echo "$CLIENTS" | jq -r '.[0]')
          gh run download "$BUILD_RUN_ID" -n "${PREFIX}${FIRST}" -R "$REPO" -D artifact
          tar -xzf artifact/benchmarkoor-build-artifacts.tar.gz -C artifact
          PAYLOAD_DIR="artifact/benchmarkoor-build-artifacts/eest-payloads/${FIRST}"
          BUILD_SIDECAR="${PAYLOAD_DIR}/.benchmarkoor-build.json"
          FILL_SIDECAR="${PAYLOAD_DIR}/.benchmarkoor-fill.json"
          FORK=""; EEST_SHA=""
          if [ -f "$BUILD_SIDECAR" ]; then
            FORK=$(jq -r '.inputs.fork // ""' "$BUILD_SIDECAR")
            EEST_SHA=$(jq -r '.inputs.eest_sha // ""' "$BUILD_SIDECAR")
          fi
          if [ -f "$FILL_SIDECAR" ]; then
            [ -n "$FORK" ] || FORK=$(jq -r '.fork // ""' "$FILL_SIDECAR")
            [ -n "$EEST_SHA" ] || EEST_SHA=$(jq -r '.eest_sha // ""' "$FILL_SIDECAR")
          fi
          if [ -z "$FORK" ] || [ -z "$EEST_SHA" ]; then
            echo "::error::Could not read fork/eest_sha from ${FIRST}'s .benchmarkoor-build.json or .benchmarkoor-fill.json on run $BUILD_RUN_ID."
            exit 1
          fi

          SNAP_SLUG=${SNAP//\//-}
          ASSET_BASE="eest-payloads-${SNAP_SLUG}-${FORK}-${TT}"
          # Build run's UTC timestamp — unique per build, yet stable across
          # release re-runs of the same build (re-releasing updates in place
          # instead of spawning a duplicate). Guarantees no tag collisions even
          # when two builds share snapshot/fork/test-type/eest_sha.
          BUILD_CREATED=$(gh run view "$BUILD_RUN_ID" -R "$REPO" --json createdAt -q .createdAt)
          BUILD_TS=$(date -u -d "$BUILD_CREATED" +%Y%m%d-%H%M%S)
          TAG='${{ inputs.tag }}'
          [ -n "$TAG" ] || TAG="eest-payloads-${SNAP_SLUG}-${FORK}-${TT}-${EEST_SHA:0:8}-${BUILD_TS}"

          # Date-prefixed title (build run's date = when the payloads were made,
          # stable across release re-runs) so releases sort/scan cleanly.
          BUILD_DATE=$(date -u -d "$BUILD_CREATED" +%Y.%m.%d)
          TITLE="${BUILD_DATE} · EEST ${TT} payloads — ${SNAP} · ${FORK} · ${EEST_SHA:0:8}"

          {
            echo "tag=$TAG"; echo "title=$TITLE"; echo "fork=$FORK"; echo "eest_sha=$EEST_SHA"
            echo "asset_base=$ASSET_BASE"; echo "snapshot=$SNAP"; echo "context=$CTX"
            echo "subdir=$SUBDIR"; echo "test_type=$TT"; echo "clients=$CLIENTS"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG='${{ steps.meta.outputs.tag }}'
          if ! gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" -R "${{ github.repository }}" --draft \
              --title "${{ steps.meta.outputs.title }}" \
              --notes "Publishing… assets are uploading."
          fi

  # One asset (or set of parts) per client, uploaded to the shared draft release.
  # Also extracts the per-target build metadata for the finalize job's notes.
  publish:
    needs: prepare-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: ${{ fromJSON(needs.prepare-release.outputs.clients) }}
    steps:
      # Before the download: checkout cleans the workspace, so it has to run
      # while there is nothing there to lose.
      - name: Check out the graft script
        if: inputs.pre-runs-from-release != ''
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - name: Download build artifact for ${{ matrix.client }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh run download "${{ inputs.build-run-id }}" \
            -n "benchmarkoor-build-${{ inputs.build-run-id }}-${{ matrix.client }}" \
            -R "${{ github.repository }}" -D dl
          mv dl/benchmarkoor-build-artifacts.tar.gz \
            "${{ needs.prepare-release.outputs.asset_base }}-${{ matrix.client }}.tar.gz"

      # A build with no pre_runs stage of its own still fills against a pre-run
      # head: the filler boots on a datadir an EARLIER build already advanced.
      # The runner replays the bundle out of the same tarball as the fixtures
      # (a runner `pre_runs:` block takes only a fixtures_subdir, never a URL of
      # its own), so the bundle has to travel inside this release. Without it
      # the runner starts at the raw snapshot head and every payload is an
      # orphan. Copy it from the release whose pre-run head the fill booted on.
      - name: Copy pre-runs from ${{ inputs.pre-runs-from-release }}
        if: inputs.pre-runs-from-release != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLIENT: ${{ matrix.client }}
          SRC_TAG: ${{ inputs.pre-runs-from-release }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ASSET="${{ needs.prepare-release.outputs.asset_base }}-${CLIENT}.tar.gz"

          # The source release names its per-client tarball in manifest.json. Its
          # asset_base differs from ours (different test-type), so read the name
          # instead of guessing it. Reassemble parts the way download.sh does.
          mkdir -p src && cd src
          gh release download "$SRC_TAG" -R "$REPO" -p manifest.json
          TARBALL=$(jq -r --arg c "$CLIENT" '.assets[] | select(.client==$c) | .tarball // empty' manifest.json)
          if [ -z "$TARBALL" ]; then
            echo "::error::Release $SRC_TAG has no asset for client $CLIENT."
            exit 1
          fi
          for f in $(jq -r --arg c "$CLIENT" '.assets[] | select(.client==$c) | .files[]' manifest.json); do
            gh release download "$SRC_TAG" -R "$REPO" -p "$f"
          done
          if [ ! -f "$TARBALL" ]; then cat "$TARBALL".part-* > "$TARBALL"; rm -f "$TARBALL".part-*; fi
          cd ..

          # Never unpack either archive: pre-run.request runs to tens of GB
          # uncompressed and a hosted runner has ~25 GB of disk. The script
          # streams both in and one out, so disk holds only the tarballs.
          python3 .github/scripts/graft-pre-runs.py \
            --into "$ASSET" --source "src/$TARBALL" \
            --client "$CLIENT" --out merged.tar.gz
          rm -rf src
          mv merged.tar.gz "$ASSET"
          echo "PRERUN_SOURCE_RELEASE=$SRC_TAG" >> "$GITHUB_ENV"

      - name: Extract build metadata, checksum, split if >2 GB, upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLIENT: ${{ matrix.client }}
        run: |
          set -euo pipefail
          TAG='${{ needs.prepare-release.outputs.tag }}'
          ASSET="${{ needs.prepare-release.outputs.asset_base }}-${CLIENT}.tar.gz"
          SIZE=$(stat -c%s "$ASSET")
          # .sha256 always refers to the whole (reassembled) tarball.
          sha256sum "$ASSET" > "$ASSET.sha256"

          # Per-target build data (same source as benchmarkoor's build summary),
          # extracted before any split, for the finalize job's notes + manifest.
          mkdir meta
          tar -xzf "$ASSET" -C meta --wildcards \
            '*/state-actor-manifest.json' '*/.benchmarkoor-fill.json' \
            '*/.benchmarkoor-build.json' '*/.benchmarkoor-pytest-report.json' \
            '*/pre-run.meta.json' 2>/dev/null || true
          SA=$(find meta -name state-actor-manifest.json | head -1)
          FILL=$(find meta -name .benchmarkoor-fill.json | head -1)
          BUILD=$(find meta -path '*eest-payloads*' -name .benchmarkoor-build.json | head -1)
          PYTEST=$(find meta -name .benchmarkoor-pytest-report.json | head -1)
          # Present only when the pre_runs target set bundle_dir — the action
          # archives the whole pre_run_bundle/ directory, this file included.
          # Also present when the step above copied a bundle in from another
          # release; PRERUN_SOURCE_RELEASE then names where it came from.
          PRERUN=$(find meta -name pre-run.meta.json | head -1)
          jq -n --arg client "$CLIENT" \
            --arg prerun_src "${PRERUN_SOURCE_RELEASE:-}" \
            --slurpfile sa "${SA:-/dev/null}" --slurpfile fill "${FILL:-/dev/null}" \
            --slurpfile build "${BUILD:-/dev/null}" --slurpfile pytest "${PYTEST:-/dev/null}" \
            --slurpfile prerun "${PRERUN:-/dev/null}" \
            '{client:$client,
              prerun_source_release:$prerun_src,
              state_actor:($sa[0] // {}),
              eest_fill:($fill[0] // {}),
              build_inputs:(($build[0] // {}).inputs // {}),
              pre_run:($prerun[0] // {}),
              pytest:(($pytest[0] // {}) | {summary, duration, exitcode, created})}' \
            > "${CLIENT}.meta.json"

          UPLOADS=("$ASSET.sha256")
          if [ "$SIZE" -gt "$MAX_ASSET_BYTES" ]; then
            echo "::notice::$ASSET is $SIZE bytes (> 2 GB) — splitting into $SPLIT_SIZE parts"
            split -b "$SPLIT_SIZE" -d -a 3 "$ASSET" "$ASSET.part-"
            rm -f "$ASSET"
            for p in "$ASSET".part-*; do UPLOADS+=("$p"); done
          else
            UPLOADS+=("$ASSET")
          fi
          gh release upload "$TAG" -R "${{ github.repository }}" --clobber "${UPLOADS[@]}"

      - name: Hand build metadata to finalize
        uses: actions/upload-artifact@v7
        with:
          name: release-meta-${{ matrix.client }}
          path: ${{ matrix.client }}.meta.json
          if-no-files-found: error

  # Aggregate manifest + checksums + download helper, render rich notes, publish.
  finalize:
    needs: [prepare-release, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Fetch per-client build metadata
        uses: actions/download-artifact@v7
        with:
          pattern: release-meta-*
          merge-multiple: true
          path: meta

      - name: Assemble manifest, checksums, helper, notes and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          TITLE: ${{ needs.prepare-release.outputs.title }}
          REPO: ${{ github.repository }}
          FORK: ${{ needs.prepare-release.outputs.fork }}
          EEST_SHA: ${{ needs.prepare-release.outputs.eest_sha }}
          ASSET_BASE: ${{ needs.prepare-release.outputs.asset_base }}
          CLIENTS: ${{ needs.prepare-release.outputs.clients }}
          SNAPSHOT: ${{ needs.prepare-release.outputs.snapshot }}
          CONTEXT: ${{ needs.prepare-release.outputs.context }}
          SUBDIR: ${{ needs.prepare-release.outputs.subdir }}
          TEST_TYPE: ${{ needs.prepare-release.outputs.test_type }}
          BUILD_RUN_ID: ${{ inputs.build-run-id }}
        run: |
          set -euo pipefail
          META_DIR="$PWD/meta"
          mkdir rel && cd rel

          # Per-asset checksums the publish legs uploaded → SHA256SUMS.
          gh release download "$TAG" -R "$REPO" -p '*.sha256' -D shas
          cat shas/*.sha256 > SHA256SUMS

          # Assets currently on the release (minus the files we generate here).
          gh release view "$TAG" -R "$REPO" \
            --json assets -q '.assets[].name' \
            | grep -vE '^(SHA256SUMS|manifest\.json|download\.sh)$' > assets.txt || true

          # manifest.json: one entry per client, with a build{} block distilled
          # from that client's state-actor manifest + eest fill sidecar.
          MANIFEST=$(jq -n \
            --arg tag "$TAG" --arg snapshot "$SNAPSHOT" --arg context "$CONTEXT" \
            --arg subdir "$SUBDIR" --arg test_type "$TEST_TYPE" --arg fork "$FORK" \
            --arg eest_sha "$EEST_SHA" \
            '{schema_version:3, tag:$tag, snapshot:$snapshot, context:$context,
              subdir:$subdir, test_type:$test_type, fork:$fork, eest_sha:$eest_sha,
              assets:[]}')
          for client in $(echo "$CLIENTS" | jq -r '.[]'); do
            base="${ASSET_BASE}-${client}.tar.gz"
            sha=$(awk -v f="$base" '$2==f {print $1}' SHA256SUMS | head -1)
            parts=$({ grep -E "^${base}(\.part-[0-9]+)?$" assets.txt || true; } | jq -R . | jq -s .)
            build=$(jq '{
                snapshot_baseline_fork: .state_actor.flags.fork,
                seed: .state_actor.flags.seed,
                chain_id: .state_actor.flags.chain_id,
                gas_limit: .state_actor.flags.gas_limit,
                target_size: .state_actor.flags.target_size,
                state_root: .state_actor.result.state_root,
                accounts_created: .state_actor.result.accounts_created,
                contracts_created: .state_actor.result.contracts_created,
                storage_slots: .state_actor.result.storage_slots,
                db_size_bytes: .state_actor.result.total_db_size_bytes,
                state_actor_version: .state_actor.state_actor.version,
                state_actor_vcs_revision: .state_actor.state_actor.vcs_revision,
                state_actor_image: .state_actor.benchmarkoor.image,
                state_actor_image_digest: .state_actor.benchmarkoor.image_digest,
                filler_client: .eest_fill.filler_client,
                filler_image: .eest_fill.filler_image,
                eest_sha: .eest_fill.eest_sha,
                eest_repo: .build_inputs.eest_repo,
                filter: .eest_fill.filter,
                fixtures_filled: .eest_fill.filled,
                fixtures_failed: .eest_fill.failed,
                fixtures_size_bytes: .eest_fill.size_bytes,
                gas_benchmark_values: .build_inputs.gas_benchmark_values,
                max_gas_per_test: .build_inputs.max_gas_per_test,
                fixed_opcode_count: .build_inputs.fixed_opcode_count,
                marker: .build_inputs.marker,
                tests: .build_inputs.tests,
                genesis_eips: (.build_inputs.genesis_eip_override.EIPs // .build_inputs.genesis_eip_override.eips),
                prerun_source_release: (.prerun_source_release | select(. != "")),
                prerun_payloads: .pre_run.payloads,
                prerun_start_block: .pre_run.start_block_number,
                prerun_start_hash: .pre_run.start_block_hash,
                prerun_end_block: .pre_run.end_block_number,
                prerun_end_hash: .pre_run.end_block_hash,
                pytest_passed: .pytest.summary.passed,
                pytest_total: .pytest.summary.total
              }' "$META_DIR/${client}.meta.json" 2>/dev/null || echo '{}')
            MANIFEST=$(echo "$MANIFEST" | jq \
              --arg client "$client" --arg base "$base" --arg sha "$sha" \
              --argjson parts "$parts" --argjson build "$build" \
              '.assets += [{client:$client, tarball:$base, sha256:$sha, files:$parts, build:$build}]')
          done
          echo "$MANIFEST" > manifest.json

          # download.sh — fetch (+ reassemble parts) + verify + untar, per client.
          cat > download.sh <<EOF
          #!/usr/bin/env bash
          # Download & verify eest payloads for release: $TAG
          set -euo pipefail
          BASE="https://github.com/$REPO/releases/download/$TAG"
          curl -fsSL "\$BASE/manifest.json" -o manifest.json
          jq -r '.assets[].files[]' manifest.json | while read -r f; do
            echo "↓ \$f"; curl -fsSL "\$BASE/\$f" -o "\$f"
          done
          for t in \$(jq -r '.assets[].tarball' manifest.json); do
            if [ ! -f "\$t" ] && ls "\$t".part-* >/dev/null 2>&1; then
              cat "\$t".part-* > "\$t"; rm -f "\$t".part-*
            fi
          done
          curl -fsSL "\$BASE/SHA256SUMS" -o SHA256SUMS
          sha256sum -c SHA256SUMS
          echo "OK — tarballs verified. Extract with: tar xzf <file>.tar.gz"
          EOF
          chmod +x download.sh

          gh release upload "$TAG" -R "$REPO" --clobber SHA256SUMS manifest.json download.sh

          # Notes: header + per-client build details (mirrors benchmarkoor's
          # build summary, sourced from the manifest/fill data in each artifact).
          hbytes() { [ -n "${1:-}" ] && [ "$1" != "null" ] && numfmt --to=iec --suffix=B "$1" 2>/dev/null || echo "—"; }
          val() { local v; v=$(jq -r "$2 // empty" <<<"$1"); [ -n "$v" ] && echo "$v" || echo "—"; }
          arr() { local v; v=$(jq -r "($2 // []) | map(tostring) | join(\", \")" <<<"$1"); [ -n "$v" ] && echo "$v" || echo "—"; }

          # What an asset holds depends on which builder produced the snapshot:
          # state_actor ships its manifest, pre_runs ships the replay bundle (and
          # only when the target set a bundle_dir). Describe what is actually in
          # there rather than naming a file that may not exist.
          CONTENTS='`eest-payloads/<client>/…` fixtures'
          if jq -e '[.assets[].build.state_root // empty] | length > 0' manifest.json >/dev/null 2>&1; then
            CONTENTS="$CONTENTS, \`state-actor/<client>/state-actor-manifest.json\`"
          fi
          if jq -e '[.assets[].build.prerun_payloads // empty] | length > 0' manifest.json >/dev/null 2>&1; then
            CONTENTS="$CONTENTS, \`pre-runs/<client>/pre_run_bundle/\`"
          fi
          {
            echo "## EEST $TEST_TYPE payloads"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Snapshot | \`$SNAPSHOT\` |"
            echo "| Fork | \`$FORK\` |"
            echo "| Context / subdir | \`$CONTEXT\` / \`$SUBDIR\` |"
            echo "| EEST commit | \`$EEST_SHA\` |"
            echo "| Promoted from build run | [\`$BUILD_RUN_ID\`](https://github.com/$REPO/actions/runs/$BUILD_RUN_ID) |"
            echo
            echo "Each \`*.tar.gz\` contains $CONTENTS."
            echo "Assets over 2 GB are split into \`.part-NNN\` files — use \`download.sh\` (fetches, reassembles, verifies against \`SHA256SUMS\`), or see \`manifest.json\`."
            echo
            echo "## Build details"
            for client in $(echo "$CLIENTS" | jq -r '.[]'); do
              b=$(jq -c --arg c "$client" '.assets[] | select(.client==$c) | .build' manifest.json)
              a=$(jq -c --arg c "$client" '.assets[] | select(.client==$c)' manifest.json)
              echo
              echo "### $client"
              echo
              # Only snapshots built by the state_actor builder ship a
              # state-actor-manifest.json. A pre_runs build (an existing chain
              # advanced in place) has none, and every field below would render
              # as "—", so skip the whole table rather than print an empty one.
              if [ "$(jq -r '[.state_root, .accounts_created, .contracts_created, .storage_slots, .db_size_bytes, .chain_id, .gas_limit, .seed, .target_size, .snapshot_baseline_fork, .state_actor_version, .state_actor_image] | map(select(. != null)) | length' <<<"$b")" -gt 0 ]; then
                echo "#### state-actor"
                echo "| Field | Value |"
                echo "|---|---|"
                echo "| State root | \`$(val "$b" .state_root)\` |"
                echo "| Accounts created | $(val "$b" .accounts_created) |"
                echo "| Contracts created | $(val "$b" .contracts_created) |"
                echo "| Storage slots | $(val "$b" .storage_slots) |"
                echo "| DB size | $(hbytes "$(jq -r '.db_size_bytes // empty' <<<"$b")") |"
                echo "| Chain ID | $(val "$b" .chain_id) |"
                echo "| Block gas limit | $(val "$b" .gas_limit) |"
                echo "| Seed | $(val "$b" .seed) |"
                echo "| Target size | $(val "$b" .target_size) |"
                echo "| Baseline fork | \`$(val "$b" .snapshot_baseline_fork)\` |"
                echo "| state-actor version | \`$(val "$b" .state_actor_version)\` |"
                echo "| Image | \`$(val "$b" .state_actor_image)\`$( d=$(jq -r '.state_actor_image_digest // empty' <<<"$b"); [ -n "$d" ] && echo " @ \`$d\`") |"
                echo
              fi
              # A pre_runs build advances an existing chain instead of
              # synthesising one; its bundle metadata is what describes the work,
              # so it stands in for the state-actor table above. Absent unless
              # the target set bundle_dir.
              if [ "$(jq -r '.prerun_payloads // "null"' <<<"$b")" != "null" ]; then
                ps=$(jq -r '.prerun_start_block' <<<"$b")
                pe=$(jq -r '.prerun_end_block' <<<"$b")
                pc=$(jq -r '.prerun_payloads' <<<"$b")
                # Contiguous means every block in (start, end] has exactly one
                # payload; a mismatch means the bundle has gaps or duplicates.
                if [ "$pc" -eq "$((pe - ps))" ]; then contig="yes"; else contig="no — $pc payloads over $((pe - ps)) blocks"; fi
                echo "#### pre-run"
                echo "| Field | Value |"
                echo "|---|---|"
                echo "| Start block | $ps (\`$(val "$b" .prerun_start_hash)\`) |"
                echo "| End block | $pe (\`$(val "$b" .prerun_end_hash)\`) |"
                echo "| Payloads | $pc |"
                echo "| Contiguous | $contig |"
                # A copied bundle did not come from this build run. Say so, and
                # name the release it came from — the fixtures below only anchor
                # if that bundle's end block is where the fill booted.
                src=$(jq -r '.prerun_source_release // empty' <<<"$b")
                if [ -n "$src" ]; then
                  echo "| Source | copied from [\`$src\`](https://github.com/$REPO/releases/tag/$src) |"
                fi
                echo
              fi
              echo "#### eest tests / benchmarks"
              echo "| Field | Value |"
              echo "|---|---|"
              echo "| Filler | $(val "$b" .filler_client) (\`$(val "$b" .filler_image)\`) |"
              echo "| EEST commit | \`$(val "$b" .eest_sha)\` |"
              echo "| Tests | $(arr "$b" .tests) |"
              echo "| Marker | $(val "$b" .marker) |"
              echo "| Gas benchmark values | $(arr "$b" .gas_benchmark_values) |"
              echo "| Activated EIPs | $(arr "$b" .genesis_eips) |"
              echo "| Max gas per test | $(val "$b" .max_gas_per_test) |"
              echo "| Fixed opcode count | $(val "$b" .fixed_opcode_count) |"
              echo "| Filter | $(val "$b" .filter) |"
              echo "| Fixtures filled / failed | $(val "$b" .fixtures_filled) / $(val "$b" .fixtures_failed) |"
              echo "| Pytest passed / total | $(val "$b" .pytest_passed) / $(val "$b" .pytest_total) |"
              echo "| Fixtures size | $(hbytes "$(jq -r '.fixtures_size_bytes // empty' <<<"$b")") |"
              echo "| Asset | \`$(val "$a" .tarball)\` ($(jq -r '.files|length' <<<"$a") file(s)) |"
              echo "| SHA256 | \`$(val "$a" .sha256)\` |"
            done
          } > notes.md
          gh release edit "$TAG" -R "$REPO" --title "$TITLE" --notes-file notes.md

          if [ '${{ inputs.draft }}' != 'true' ]; then
            gh release edit "$TAG" -R "$REPO" --draft=false
          fi
