global:
  env:
    EEST_FIXTURES_DIR: /tmp/benchmarkoor/eest-fixtures/glamsterdam

    # When amsterdam activates, just after jochemnet's OWN activation: the geth
    # genesis already schedules amsterdamTime 1769856767, and the snapshot head
    # (block 24402727, ts 1770454055) sits ~6.9 days past it, so this chain is
    # already on amsterdam. Scheduling activation after the head instead
    # (upstream's example says head_ts + 3) contradicts that history, and a
    # state-actor-style activation at 1 claims the whole mainnet history was
    # amsterdam.
    #
    # The value does NOT decide whether a fill crosses into amsterdam — the
    # builder's `fork: amsterdam` makes EEST build amsterdam blocks either way.
    # Runs 31087806563 (head_ts+3) and 31089586152 (an unreachable 1800000000)
    # both reached engine_newPayloadV5 and failed identically; 31133523115 went
    # green on the value below.
    #
    # Lives in this context global because BOTH benchmarkoor-build.yaml and
    # benchmarkoor-run.yaml load it — the build and the run have to agree on the
    # schedule of the datadir they pass between them.
    AMSTERDAM_ACTIVATION_TS: "1769856769"
