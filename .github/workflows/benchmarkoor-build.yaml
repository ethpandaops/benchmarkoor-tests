name: benchmarkoor-build

# Embed the dispatch context in the run title so benchmarkoor-release.yaml can
# recover snapshot/context/subdir/test-type from just the build run ID (GitHub's
# API doesn't expose workflow_dispatch inputs). Values are space-free, so the
# release workflow parses them with `grep -oE 'key=[^ ]+'`.
run-name: "benchmarkoor-build · snapshot=${{ inputs.snapshot }} · context=${{ inputs.context }} · subdir=${{ inputs.subdir }} · test-type=${{ inputs.test-type }}"

on:
  workflow_dispatch:
    inputs:
      clients:
        description: "JSON array of execution clients to benchmark"
        required: false
        default: '["nethermind"]'
      instance-id:
        description: "Set this if you have multiple configurations for the same client but just want to run one of them"
        required: false
        default: ""
      snapshot:
        description: "Snapshot path "
        required: false
        type: choice
        options:
          - "state-actor/v1"
          - "jochemnet/v1"
      context:
        description: "Test context"
        required: false
        type: choice
        options:
          - "repricing"
        default: "repricing"
      subdir:
        description: "Subdirectory"
        required: true
        type: choice
        options:
          # State actor
          - "v1/bal-devnet-7"
          - "v1/glamsterdam-devnet-6"
          - "v1/glamsterdam-devnet-7"
          - "v1/glamsterdam-devnet-7-full"
          # Jochemnet
          - "jochemnet/v1/glamsterdam-devnet-7"
          - "jochemnet/v1/glamsterdam-devnet-8"
      test-type:
        description: "Test type to run"
        required: false
        type: choice
        options:
          - "stateful"
          - "compute"
        default: "stateful"
      build-timeout-minutes:
        description: "Timeout for the benchmark build (minutes)"
        required: false
        default: "2160"
      image:
        description: "Benchmarkoor docker image. Empty builds the image locally from git-ref (the action only honours git-ref when this is empty)."
        required: false
        default: "ghcr.io/ethpandaops/benchmarkoor:master"
      git-ref:
        description: "Git reference to checkout for benchmarkoor"
        required: false
        default: ""
      build-config:
        description: 'Raw YAML config content to pass via --config (appended after URL config)'
        required: false
        default: ''

jobs:
  benchmarkoor:
    strategy:
      fail-fast: false
      matrix:
        client: ${{ fromJSON(inputs.clients) }}
    runs-on:
      group: gasbenchmark
      labels:
        # The runner pool follows the subdir, because a build can only run where
        # its snapshots live: jochemnet subdirs need the jochemnet hosts, every
        # other subdir stays on the v1 pool.
        - >-
          ${{
            contains(inputs.subdir, 'jochemnet')
              && format('benchmarkoor-v1-jochemnet-runner-{0}', matrix.client)
              || format('benchmarkoor-v1-runner-{0}', matrix.client)
          }}
        # Pin a client's build to a specific host. The pin only applies to the
        # jochemnet pool, because the pinned host carries a jochemnet label.
        # Every other case repeats the label above (harmless duplicate → no pin).
        - >-
          ${{
            contains(inputs.subdir, 'jochemnet')
              && (matrix.client == 'geth'
                    && 'benchmarkoor-v1-jochemnet-runner-benchmark-ci-3'
                    || format('benchmarkoor-v1-jochemnet-runner-{0}', matrix.client))
              || format('benchmarkoor-v1-runner-{0}', matrix.client)
          }}
    timeout-minutes: ${{ fromJSON(inputs.build-timeout-minutes) }}
    steps:
      - name: "Infos: Client=${{ matrix.client }} | Snapshot=${{ inputs.snapshot }} | TestType=${{ inputs.test-type }} | Context=${{ inputs.context }} | Subdirectory=${{ inputs.subdir }}"
        run: |
          echo "client: ${{ matrix.client }}"
          echo "snapshot: ${{ inputs.snapshot }}"
          echo "test-type: ${{ inputs.test-type }}"
          echo "subdir: ${{ inputs.subdir }}"
          echo "build-timeout-minutes: ${{ inputs.build-timeout-minutes }}"
          echo "image: ${{ inputs.image }}"
          echo "git-ref: ${{ inputs.git-ref }}"

      - uses: actions/checkout@v5

      - name: Calculate builder run timeout
        id: calc
        run: |
          echo "builder_timeout=$(( ${{ inputs.build-timeout-minutes }} - 30 ))m" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: ethpandaops/benchmarkoor@master
        env:
          BENCHMARKOOR_BUILDER_RUN_TIMEOUT: ${{ steps.calc.outputs.builder_timeout }}
        with:
          mode: build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ inputs.image }}
          git-ref: ${{ inputs.git-ref }}
          upload-artifacts: "false"
          # Upload each client's eest fixtures + state-actor manifest as a
          # per-client artifact so benchmarkoor-release.yaml can promote them.
          upload-build-artifacts: "true"
          build-artifact-name: benchmarkoor-build-${{ github.run_id }}-${{ matrix.client }}
          build-config-urls: >-
            https://raw.githubusercontent.com/ethpandaops/benchmarkoor-tests/${{ github.sha }}/configs/global.yaml,
            https://raw.githubusercontent.com/ethpandaops/benchmarkoor-tests/${{ github.sha }}/configs/datadirs/${{ inputs.snapshot }}/global.yaml,
            https://raw.githubusercontent.com/ethpandaops/benchmarkoor-tests/${{ github.sha }}/configs/datadirs/${{ inputs.snapshot }}/builder.yaml,
            https://raw.githubusercontent.com/ethpandaops/benchmarkoor-tests/${{ github.sha }}/configs/contexts/${{ inputs.context }}/${{ inputs.subdir }}/global.yaml,
            https://raw.githubusercontent.com/ethpandaops/benchmarkoor-tests/${{ github.sha }}/configs/contexts/${{ inputs.context }}/${{ inputs.subdir }}/test-source.${{ inputs.test-type }}.builder.yaml,
          build-args: >-
            --rebuild-on-diff
            --limit-state-actor-target=${{ matrix.client }}
            --limit-pre-runs-target=${{ matrix.client }}
            --limit-eest-payload-target=${{ matrix.client }}
          build-config: ${{ inputs.build-config }}
