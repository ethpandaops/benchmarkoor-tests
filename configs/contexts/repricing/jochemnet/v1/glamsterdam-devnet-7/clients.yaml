runner:
  # One bal-full instance per client. The sequential/nobatchio A/B variants are
  # retired — full BAL mode is the mode under analysis. Besu keeps its AOT twin
  # for the JVM-warmup comparison.
  instances:
    # Geth
    ### NOTE: Geth doesn't have the bal.* flags anymore in ethpandaops/geth:glamsterdam-devnet-7
    - id: geth-bal-full
      client: geth
      metadata:
        labels:
          bal-mode: full
      #image: ethpandaops/geth:glamsterdam-devnet-7
      image: ghcr.io/jochem-brouwer/go-ethereum:glamsterdam-devnet-7-blobpool-fix
      extra_args:
        - --engine.maxreorgdepth=1024
        - --override.amsterdam=${AMSTERDAM_ACTIVATION_TS}
        - --debug.logslowblock=0

    # Besu
    #
    # 00d2f04 is the current head of the rolling glamsterdam-devnet-7 tag, and
    # digest-identical to it. Pinned per-commit because the AOT cache is only
    # valid for the exact jars it was generated against, so the rolling tag
    # moving would silently unpair the A/B comparison.
    # Bump both together, and only once a matching AOT cache exists.
    - id: besu-bal-full
      client: besu
      metadata:
        labels:
          bal-mode: full
      image: ethpandaops/besu:glamsterdam-devnet-7-00d2f04
      genesis_fork_override:
        amsterdam: ${AMSTERDAM_ACTIVATION_TS}
      environment:
        BESU_OPTS: "-Xms8g -Xmx8g -XX:+AlwaysPreTouch"
      extra_args:
        - --Xplugin-rocksdb-high-spec-enabled=true
        # Bal mode flags
        - --Xbal-perfect-parallelization-enabled=true
        - --Xbal-state-root-enabled=true
        - --Xbal-prefetch-reading-enabled=true
        - --Xbal-prefetch-batch-size=8
        # The following flags don't exist in the glamsterdam-devnet-7 branch:
        # - --Xbal-processing-timeout=-1
        # - --Xbal-state-root-timeout=-1

    # Same as besu-bal-full, but on the AOT-cache image: the JVM starts
    # pre-warmed (Project Leyden) so Besu isn't penalised for JIT/C2 warmup.
    # PoC image, built manually by baking a Besu-team-provided AOT cache into
    # ethpandaops/besu:glamsterdam-devnet-7-00d2f04 (no recompile) and validated to load. This
    # is experimental and expected to be reverted once comparison numbers are in.
    # BESU_OPTS is a JVM env var, so it must go here, not in extra_args.
    # AOTMode=on makes the JVM refuse to start if the cache can't be mapped.
    # Without it the JVM silently falls back to a cold run (exit 0), which would
    # publish results labelled aot:"true" that got no AOT benefit at all.
    - id: besu-bal-full-aot
      client: besu
      metadata:
        labels:
          bal-mode: full
          aot: "true"
      image: ethpandaops/besu:glamsterdam-devnet-7-aot-00d2f04
      genesis_fork_override:
        amsterdam: ${AMSTERDAM_ACTIVATION_TS}
      environment:
        BESU_OPTS: "-Xms8g -Xmx8g -XX:+AlwaysPreTouch -XX:AOTCache=/opt/besu/aot/besu.aot -XX:AOTMode=on -Xlog:aot=info"
      extra_args:
        - --Xplugin-rocksdb-high-spec-enabled=true
        # Bal mode flags
        - --Xbal-perfect-parallelization-enabled=true
        - --Xbal-state-root-enabled=true
        - --Xbal-prefetch-reading-enabled=true
        - --Xbal-prefetch-batch-size=8
        # The following flags don't exist in the glamsterdam-devnet-7 branch:
        # - --Xbal-processing-timeout=-1
        # - --Xbal-state-root-timeout=-1

    # Reth
    - id: reth-bal-full
      client: reth
      metadata:
        labels:
          bal-mode: full
      image: ethpandaops/reth:glamsterdam-devnet-7-acf6e17
      genesis_fork_override:
        amsterdam: ${AMSTERDAM_ACTIVATION_TS}
      extra_args:
        - --engine.slow-block-threshold=0
      retry_new_payloads_failed_state:
        enabled: true
        max_retries: 10
        backoff: 1s

    # Nethermind
    - id: nethermind-bal-full
      client: nethermind
      metadata:
        labels:
          bal-mode: full
      #image:  nethermindeth/nethermind:master
      image: ethpandaops/nethermind:qu0b-qu0b-flatdb-persist-on-shutdown
      genesis_eip_override:
        timestamp: ${AMSTERDAM_ACTIVATION_TS}
        eips: [2780, 7708, 7778, 7843, 7928, 7954, 7976, 7981, 7997, 8024, 8037, 8038, 8246, 8282]
      extra_args:
        - --Init.BaseDbPath=/data
        - --FlatDb.Enabled=true
        - --FlatDb.CompactionOffset=0
        - --FlatDb.MinReorgDepth=1024
        - --FlatDb.MaxReorgDepth=1024
        - --Blocks.ParallelExecution=true # Default is true, but set explicitly for clarity
        - --Blocks.ParallelExecutionBatchRead=true # Default is true, but set explicitly for clarity

    # Erigon
    ## Help for erigon flags:
      # --exec.batched-io  | true      | Turn on/off batched ahead of time db reads
      # --exec.state-cache | true      | Turn on/off local caching of db reads
      # --exec.workers     | num cpu/2 | Number of workers used for exec
      # --exec.serial      | false     | Force workers to be 1
      # --exec.no-merge.   | false.    | Turn off background merging
      # --exec.no-prune.   | false.    | Turn off db removal
    ##
    - id: erigon-bal-full
      client: erigon
      metadata:
        labels:
          bal-mode: full
      image: ethpandaops/erigon:glamsterdam-devnet-7
      extra_args:
        - --override.amsterdam=${AMSTERDAM_ACTIVATION_TS}
        - --exec.no-merge=true
        - --exec.no-prune=true
        - --exec.no-background-maintenance
        - --experimental.parallel-commitment
      bootstrap_fcu:
        enabled: true
        max_retries: 120
        backoff: 30s
      # erigon answers newPayload with SYNCING while it is still processing, and
      # the pre-run replay treats a non-VALID status as a failure — it died on
      # the same payload (line 10003) on both attempts. Retry SYNCING rather
      # than the failed-state path; the two are separate settings and SYNCING
      # takes this one. Same generous budget as bootstrap_fcu above — erigon
      # can be slow to settle — but still bounded, so a stuck client fails
      # rather than stalling a ~15k-payload replay forever.
      retry_new_payloads_syncing_state:
        enabled: true
        max_retries: 240
        backoff: 30s

    # Ethrex
    - id: ethrex-bal-full
      client: ethrex
      metadata:
        labels:
          bal-mode: full
      image: ethpandaops/ethrex:glamsterdam-devnet-7-3f6569f
      genesis_fork_override:
        amsterdam: ${AMSTERDAM_ACTIVATION_TS}
      extra_args:
        - --skip-genesis-validation
        - --no-precompile-cache

    # Nimbus
    - id: nimbus-bal-full
      client: nimbus
      metadata:
        labels:
          bal-mode: full
      image: ethpandaops/nimbus-eth1:glamsterdam-devnet-7
      genesis_fork_override:
        amsterdam: ${AMSTERDAM_ACTIVATION_TS}
